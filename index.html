<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Speculum AI 💎 — Home</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-center">
    <div class="card glass">
      <h1 class="title">💎 Speculum AI</h1>
      <p class="subtitle">Your personal Fitness & Acting trainer</p>

      <input id="username" type="text" placeholder="Enter your name" />

      <div class="row">
        <button id="registerBtn">Register</button>
        <button id="loginBtn">Login</button>
      </div>

      <div class="row">
        <button id="guestBtn" class="ghost">Continue as Guest</button>
      </div>

      <p class="small">Already registered? type your name and click Login.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
